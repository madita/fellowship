name: Deploy to Staging

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, zip, pdo_mysql, curl, gd, bcmath, intl, sqlite
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Cache Composer deps
        uses: actions/cache@v4  # Updated to v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate key & set perms
        run: |
          php artisan key:generate
          chmod -R 777 storage bootstrap/cache

      - name: Create SQLite database
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Install & build assets
        run: |
          rm -rf node_modules package-lock.json
          npm install
          npm run build

      - name: Run PHPUnit
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: vendor/bin/phpunit

      - name: Run Jest
        run: npm test

  build:
    needs: run-tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, zip, pdo_mysql, curl, gd, bcmath, intl
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Composer deps
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      - name: Install NPM dependencies & build
        run: |
          rm -rf node_modules package-lock.json
          npm install
          npm run build

      - name: Create deployment artifact
        run: |
          mkdir -p deployment
          tar -czf deployment/app.tar.gz \
            --exclude=node_modules \
            --exclude=.git \
            --exclude=tests \
            --exclude=storage/logs \
            --exclude=.env \
            .

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: deployment/

  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Staging Server
        run: |
          # Create a temporary script to avoid quote issues
          cat > deploy_script.sh << 'SCRIPT_EOF'
          #!/bin/bash
          set -e

          echo "Starting deployment to ${{ secrets.STAGING_HOST }}"
          echo "Current user: $(whoami)"
          echo "Current directory: $(pwd)"
          echo "Target directory: ${{ secrets.STAGING_PATH }}"

          # Create backup if directory exists
          if [ -d "${{ secrets.STAGING_PATH }}" ]; then
            echo "Creating backup..."
            cp -r "${{ secrets.STAGING_PATH }}" "${{ secrets.STAGING_PATH }}_backup_$(date +%Y%m%d_%H%M%S)" || echo "Backup creation failed, continuing..."
          fi

          # Create/access target directory
          echo "Creating/accessing target directory..."
          mkdir -p "${{ secrets.STAGING_PATH }}"
          cd "${{ secrets.STAGING_PATH }}"
          echo "Successfully changed to: $(pwd)"

          # Create .env file
          echo "Creating .env file..."
          cat > .env << 'ENV_EOF'
          ${{ secrets.DOT_ENV_STAGING }}
          ENV_EOF
          echo ".env file created successfully"

          # Check if npm exists, install if not
          if ! command -v npm >/dev/null 2>&1; then
            echo "Installing Node.js..."
            curl -fsSL https://deb.nodesource.com/setup_lts.x | sudo -E bash -
            sudo apt-get install -y nodejs
          fi

          # Execute deployment script or manual steps
          if [ -f server_deploy.sh ]; then
            echo "Found server_deploy.sh, executing..."
            chmod +x server_deploy.sh
            bash server_deploy.sh
          else
            echo "Running basic deployment..."
            git pull origin develop || true
            composer install --no-dev --optimize-autoloader --no-interaction || true
            npm ci --only=production || npm install --only=production || true
            npm run build || npm run production || true
            php artisan migrate --force || true
            php artisan config:cache || true
          fi

          echo "Deployment completed successfully!"
          SCRIPT_EOF

          # Copy script to server and execute
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no deploy_script.sh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}:/tmp/
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} "chmod +x /tmp/deploy_script.sh && /tmp/deploy_script.sh && rm /tmp/deploy_script.sh"
