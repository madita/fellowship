name: Staging

on:
  push:
    branches:
      - develop
  pull_request:
    branches: [ develop ]
  workflow_dispatch:  # Allows manual triggering

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, zip, pdo_mysql, curl, gd, bcmath, intl, sqlite
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Cache Composer deps
        uses: actions/cache@v4  # Updated to v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate key & set perms
        run: |
          php artisan key:generate
          chmod -R 777 storage bootstrap/cache

      - name: Create SQLite database
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Install & build assets
        run: |
          rm -rf node_modules package-lock.json
          npm install
          npm run build

      - name: Run PHPUnit
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: vendor/bin/phpunit

      - name: Run Jest
        run: npm test

  build:
    needs: run-tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, zip, pdo_mysql, curl, gd, bcmath, intl
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Composer deps
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      - name: Install NPM dependencies & build
        run: |
          rm -rf node_modules package-lock.json
          npm install
          npm run build

      - name: Create deployment artifact
        run: |
          mkdir -p deployment
          tar -czf deployment/app.tar.gz \
            --exclude=node_modules \
            --exclude=.git \
            --exclude=tests \
            --exclude=storage/logs \
            --exclude=.env \
            .

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: deployment/

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: app-build
          path: deployment/

      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOT_ENV: ${{ secrets.DOT_ENV_STAGING }}
          BASE_PATH: ${{ secrets.PATH_STAGING }}
        with:
          host: ${{ secrets.SSH_HOST }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DOT_ENV,BASE_PATH
          script_stop: true
          request_pty: true  # This enables TTY for sudo
          script: |
            set -e

            echo "Starting deployment to ${BASE_PATH}"

            # Create backup (without sudo if possible)
            if [ -d "${BASE_PATH}" ]; then
              cp -r ${BASE_PATH} ${BASE_PATH}_backup_$(date +%Y%m%d_%H%M%S) 2>/dev/null || echo "Backup creation failed, continuing..."
            fi

            # Create directory if it doesn't exist
            mkdir -p ${BASE_PATH} || sudo mkdir -p ${BASE_PATH}
            cd ${BASE_PATH}

            # Create .env file
            echo "${DOT_ENV}" > .env || echo "${DOT_ENV}" | sudo tee .env > /dev/null

            # Run deployment script if it exists
            if [ -f "server_deploy.sh" ]; then
              bash server_deploy.sh
            else
              echo "server_deploy.sh not found, running basic deployment"

              # Check if we can run without sudo first
              if command -v php >/dev/null 2>&1; then
                # Basic Laravel deployment steps
                php artisan down --retry=60 || true

                # Update composer dependencies
                composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev || echo "Composer install failed"

                # Clear and cache Laravel
                php artisan config:clear || true
                php artisan cache:clear || true
                php artisan route:clear || true
                php artisan view:clear || true
                php artisan config:cache || true
                php artisan route:cache || true
                php artisan view:cache || true

                # Run migrations
                php artisan migrate --force || echo "Migration failed"

                # Set permissions (try without sudo first)
                chown -R www-data:www-data ${BASE_PATH} 2>/dev/null || sudo chown -R www-data:www-data ${BASE_PATH} 2>/dev/null || echo "Permission change failed"
                chmod -R 755 ${BASE_PATH} 2>/dev/null || sudo chmod -R 755 ${BASE_PATH} 2>/dev/null || echo "Permission change failed"
                chmod -R 775 ${BASE_PATH}/storage 2>/dev/null || sudo chmod -R 775 ${BASE_PATH}/storage 2>/dev/null || echo "Permission change failed"
                chmod -R 775 ${BASE_PATH}/bootstrap/cache 2>/dev/null || sudo chmod -R 775 ${BASE_PATH}/bootstrap/cache 2>/dev/null || echo "Permission change failed"

                # Bring application back up
                php artisan up || true
              else
                echo "PHP not found in PATH, deployment may require manual intervention"
              fi
            fi

            echo "Deployment completed"
