name: Staging

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, zip, pdo_mysql, curl, gd, bcmath, intl, sqlite
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Cache Composer deps
        uses: actions/cache@v4  # Updated to v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate key & set perms
        run: |
          php artisan key:generate
          chmod -R 777 storage bootstrap/cache

      - name: Create SQLite database
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Install & build assets
        run: |
          rm -rf node_modules package-lock.json
          npm install
          npm run build

      - name: Run PHPUnit
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: vendor/bin/phpunit

      - name: Run Jest
        run: npm test

  build:
    needs: run-tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, zip, pdo_mysql, curl, gd, bcmath, intl
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Composer deps
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      - name: Install NPM dependencies & build
        run: |
          rm -rf node_modules package-lock.json
          npm install
          npm run build

      - name: Create deployment artifact
        run: |
          mkdir -p deployment
          tar -czf deployment/app.tar.gz \
            --exclude=node_modules \
            --exclude=.git \
            --exclude=tests \
            --exclude=storage/logs \
            --exclude=.env \
            .

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: deployment/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: app-build
          path: deployment/

      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.0.3  # Updated to specific version
        env:
          DOT_ENV: ${{ secrets.DOT_ENV_STAGING }}
          BASE_PATH: ${{ secrets.PATH_STAGING }}
        with:
          host: ${{ secrets.SSH_HOST }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DOT_ENV,BASE_PATH
          script_stop: true  # Stop on first error
          script: |
            set -e  # Exit on any error

            echo "Starting deployment to ${BASE_PATH}"

            # Create backup
            # if [ -d "${BASE_PATH}" ]; then
            #   cp -r ${BASE_PATH} ${BASE_PATH}_backup_$(date +%Y%m%d_%H%M%S)
            # fi

            # Create directory if it doesn't exist
            # mkdir -p ${BASE_PATH}
            # cd ${BASE_PATH}

            # Create .env file
            echo "${DOT_ENV}" | tee .env > /dev/null

            # Run deployment script if it exists
            if [ -f "server_deploy.sh" ]; then
              bash server_deploy.sh
            else
              echo "server_deploy.sh not found, running basic deployment"

              # Basic Laravel deployment steps
              php artisan down --retry=60 || true

              # Update composer dependencies
              composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

              # Clear and cache Laravel
              php artisan config:clear
              php artisan cache:clear
              php artisan route:clear
              php artisan view:clear
              php artisan config:cache
              php artisan route:cache
              php artisan view:cache

              # Run migrations
              php artisan migrate --force

              # Set permissions
              # chown -R www-data:www-data ${BASE_PATH}
              chmod -R 755 ${BASE_PATH}
              chmod -R 775 ${BASE_PATH}/storage
              chmod -R 775 ${BASE_PATH}/bootstrap/cache

              # Bring application back up
              php artisan up
            fi

            echo "Deployment completed successfully"
