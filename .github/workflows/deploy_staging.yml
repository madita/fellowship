name: Staging

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, zip, pdo_mysql, curl, gd, bcmath, intl, sqlite
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Cache Composer deps
        uses: actions/cache@v4  # Updated to v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate key & set perms
        run: |
          php artisan key:generate
          chmod -R 777 storage bootstrap/cache

      - name: Create SQLite database
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Install & build assets
        run: |
          rm -rf node_modules package-lock.json
          npm install
          npm run build

      - name: Run PHPUnit
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: vendor/bin/phpunit

      - name: Run Jest
        run: npm test

  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, mysql
          coverage: none

      - name: Install Node.js dependencies
        run: |
          npm ci
          npm audit fix --force || true

      - name: Build frontend assets
        run: |
          npm run build
          echo "✅ Frontend assets built successfully"
          ls -la public/build/ || echo "Build directory structure:"
          find public -type f -name "*.js" -o -name "*.css" | head -10

      - name: Install PHP dependencies
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Prepare deployment package
        run: |
          echo "📦 Creating deployment package..."

          # Create deployment directory
          mkdir -p deploy

          # Copy all files except what we don't need
          rsync -av \
            --exclude=node_modules \
            --exclude=.git \
            --exclude=.github \
            --exclude=tests \
            --exclude=.env.example \
            --exclude=README.md \
            --exclude=.gitignore \
            --exclude=deploy \
            ./ deploy/

          # Create tarball
          cd deploy
          tar -czf ../deployment.tar.gz .
          cd ..

          echo "Package size: $(du -sh deployment.tar.gz)"

      - name: Setup SSH
        run: |
          echo "🔑 Setting up SSH connection..."

          # Create SSH directory
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Check if required secrets exist
          if [ -z "${{ secrets.STAGING_SSH_KEY }}" ]; then
            echo "❌ ERROR: STAGING_SSH_KEY secret is not set"
            echo "Please add your SSH private key to GitHub Secrets"
            exit 1
          fi

          if [ -z "${{ secrets.STAGING_HOST }}" ]; then
            echo "❌ ERROR: STAGING_HOST secret is not set"
            echo "Please add your server hostname/IP to GitHub Secrets"
            exit 1
          fi

          if [ -z "${{ secrets.STAGING_USER }}" ]; then
            echo "❌ ERROR: STAGING_USER secret is not set"
            echo "Please add your SSH username to GitHub Secrets"
            exit 1
          fi

          if [ -z "${{ secrets.STAGING_PATH }}" ]; then
            echo "❌ ERROR: STAGING_PATH secret is not set"
            echo "Please add your deployment path to GitHub Secrets"
            exit 1
          fi

          # Setup SSH key
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Add host to known hosts
          ssh-keyscan -H "${{ secrets.STAGING_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || {
            echo "Warning: Could not add host to known_hosts, disabling strict checking"
            echo "StrictHostKeyChecking no" >> ~/.ssh/config
            echo "UserKnownHostsFile /dev/null" >> ~/.ssh/config
          }

          echo "✅ SSH setup completed"

      - name: Test SSH connection
        run: |
          echo "🧪 Testing SSH connection..."

          # Test basic SSH connection
          if ssh -i ~/.ssh/deploy_key -o ConnectTimeout=10 -o BatchMode=yes "${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}" "echo 'SSH connection successful'"; then
            echo "✅ SSH connection test passed"
          else
            echo "❌ SSH connection failed"
            echo "Please check:"
            echo "1. SSH key is correct and has access"
            echo "2. Server hostname/IP is correct"
            echo "3. Username is correct"
            echo "4. Server allows SSH connections"
            exit 1
          fi

      - name: Deploy to staging server
        run: |
          echo "🚀 Deploying to staging server..."

          # Upload deployment package
          echo "📤 Uploading deployment package..."
          if scp -i ~/.ssh/deploy_key -o ConnectTimeout=30 deployment.tar.gz "${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}:/tmp/"; then
            echo "✅ Upload successful"
          else
            echo "❌ Upload failed"
            exit 1
          fi

          # Deploy on server
          echo "🔄 Deploying on server..."
          ssh -i ~/.ssh/deploy_key "${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}" << 'EOF'
            set -e

            echo "📁 Starting deployment process..."

            # Check if deployment path exists
            if [ ! -d "${{ secrets.STAGING_PATH }}" ]; then
              echo "❌ Deployment path does not exist: ${{ secrets.STAGING_PATH }}"
              echo "Please create the directory or check STAGING_PATH secret"
              exit 1
            fi

            cd "${{ secrets.STAGING_PATH }}"
            echo "📍 Current directory: $(pwd)"

            # Backup current .env and any important files
            echo "💾 Backing up important files..."
            cp .env .env.backup 2>/dev/null || echo "No .env file to backup"

            # Extract new deployment
            echo "📦 Extracting new deployment..."
            if [ -f /tmp/deployment.tar.gz ]; then
              tar -xzf /tmp/deployment.tar.gz
              rm /tmp/deployment.tar.gz
              echo "✅ Deployment extracted successfully"
            else
              echo "❌ Deployment file not found"
              exit 1
            fi

            # Restore backed up files
            echo "♻️ Restoring backed up files..."
            cp .env.backup .env 2>/dev/null || echo "No .env backup to restore"
            rm -f .env.backup 2>/dev/null || true

            # Set proper permissions (without sudo)
            echo "🔐 Setting permissions..."
            chmod -R 775 storage bootstrap/cache 2>/dev/null || echo "Permission setting may require manual adjustment"

            # Laravel deployment steps
            echo "🐘 Running Laravel commands..."

            # Check if composer exists
            if ! command -v composer &> /dev/null; then
              echo "❌ Composer not found. Please install composer on the server."
              exit 1
            fi

            # Laravel deployment
            php artisan migrate --force

            # Clear all caches
            php artisan config:clear
            php artisan cache:clear
            php artisan route:clear
            php artisan view:clear

            # Rebuild caches
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Check Laravel status
            echo "🔍 Checking Laravel status..."
            php artisan --version || echo "Could not get Laravel version"

            echo "✅ Deployment completed successfully!"
            echo "🌐 Frontend assets built in CI, no npm needed on server!"
            echo "📊 Current disk usage:"
            df -h . | head -2
          EOF

          echo "🎉 Deployment finished successfully!"

      - name: Cleanup
        if: always()
        run: |
          # Clean up sensitive files
          rm -f ~/.ssh/deploy_key
          rm -f deployment.tar.gz
